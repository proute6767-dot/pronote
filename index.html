<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mon Pronote</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--tx:#eef0f4;--mut:#8b93a3;--ac:#4f8cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 14px 90px}
h1{font-size:22px;margin:16px 0 8px}.card{background:var(--card);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;justify-content:space-between;gap:10px}.mut{color:var(--mut);font-size:14px}
.big{font-size:40px;font-weight:700;color:var(--ac)}.off{background:#5a1d24;text-decoration:line-through}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:var(--card);padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:6px}
nav button{flex:none;background:none;border:0;color:var(--mut);padding:8px 12px;border-radius:10px;font:inherit}
nav button.on{background:var(--ac);color:#fff}input,button.go{font:inherit;padding:10px;border-radius:10px;border:0}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:44px;height:44px;border-radius:50%;border:2px solid var(--mut)}
.g1{color:#ff6b6b}.g2{color:#ffb84d}.g3{color:#5fd68a}
</style></head><body>
<div id="app"></div><nav id="nav"></nav>
<script>
const T={"Sombre":["#0f1115","#1a1d24","#eef0f4","#8b93a3"],"Clair":["#f3f4f7","#ffffff","#16181d","#667085"],"Nuit bleue":["#0a1530","#13224a","#eaf0ff","#8fa3d6"],"Violet":["#1a1030","#2a1b4d","#f1eaff","#b39ddb"],"Rose":["#2a1020","#3d1a30","#ffe9f4","#d99ab8"]};
const TABS=["Emploi du temps","Notes","Devoirs","Vie scolaire","Messages","Infos","Cantine","Thème"];
let D=null,tab=0;
const $=id=>document.getElementById(id),L=localStorage;
const fmt=(s,o)=>new Date(s).toLocaleString("fr-FR",o);
function theme(){const t=T[L.theme||"Sombre"];const r=document.documentElement.style;["--bg","--card","--tx","--mut"].forEach((k,i)=>r.setProperty(k,t[i]));r.setProperty("--ac",L.ac||"#4f8cff")}
async function load(fresh){
 if(!L.code){L.code=prompt("Code d'accès")||"";}
 $("app").innerHTML="<p class=mut>Chargement…</p>";
 const r=await fetch("/api/data"+(fresh?"?fresh=1":""),{headers:{"X-Code":L.code}});
 if(r.status==401){L.code="";$("app").innerHTML="<p>Code incorrect. Recharge la page.</p>";return}
 if(!r.ok){$("app").innerHTML="<p>Pronote ne répond pas. Réessaie dans une minute.</p>";return}
 D=await r.json();draw()}
const cls=(n,o)=>{const v=n/o*20;return v<10?"g1":v<14?"g2":"g3"};
function draw(){
 $("nav").innerHTML=TABS.map((t,i)=>`<button class="${i==tab?"on":""}" onclick="tab=${i};draw()">${t}</button>`).join("");
 let h="";
 if(tab==0){h="<h1>Emploi du temps</h1>";let day="";for(const l of D.lessons){const d=fmt(l.start,{weekday:"long",day:"numeric",month:"long"});if(d!=day){day=d;h+=`<p class=mut>${d}</p>`}
  h+=`<div class="card row ${l.canceled?"off":""}"><b>${l.s}</b><span>${fmt(l.start,{hour:"2-digit",minute:"2-digit"})}–${fmt(l.end,{hour:"2-digit",minute:"2-digit"})}</span></div>${l.canceled?"<div class=mut>Cours annulé</div>":l.room?`<div class=mut>Salle ${l.room}</div>`:""}`}}
 if(tab==1){h=`<h1>Moyenne générale</h1><div class=big>${D.overall||"–"}</div><h1>Par matière</h1>`;
  for(const a of D.averages){const n=parseFloat(String(a.me).replace(",","."));h+=`<div class="card row"><b>${a.s}</b><span class="${isNaN(n)?"":cls(n,20)}">${a.me}</span></div><div class=mut>Classe : ${a.cls}</div>`}
  h+="<h1>Dernières notes</h1>";for(const x of D.grades.slice(-30).reverse()){const n=parseFloat(String(x.grade).replace(",",".")),o=parseFloat(String(x.out_of).replace(",","."));h+=`<div class="card row"><span>${x.s}<br><span class=mut>${fmt(x.date,{day:"numeric",month:"short"})}</span></span><b class="${isNaN(n)?"":cls(n,o)}">${x.grade}/${x.out_of}</b></div>`}}
 if(tab==2){h="<h1>Devoirs</h1>"+D.homework.map(x=>`<div class=card><b>${x.s}</b> <span class=mut>pour le ${fmt(x.date,{weekday:"long",day:"numeric",month:"short"})}${x.done?" · fait":""}</span><br>${x.text}</div>`).join("")}
 if(tab==3){h="<h1>Absences</h1>"+D.absences.map(x=>`<div class=card>${fmt(x.from,{day:"numeric",month:"short"})} <span class=mut>${x.ok?"justifiée":"non justifiée"}</span></div>`).join("")+"<h1>Retards</h1>"+D.delays.map(x=>`<div class=card>${fmt(x.date,{day:"numeric",month:"short"})} · ${x.min} min <span class=mut>${x.ok?"justifié":"non justifié"}</span></div>`).join("")+"<h1>Punitions</h1>"+D.punishments.map(x=>`<div class=card>${fmt(x.date,{day:"numeric",month:"short"})} · ${x.what||""}</div>`).join("")}
 if(tab==4){h="<h1>Messages</h1>"+D.messages.map(x=>`<div class=card><b>${x.unread?"● ":""}${x.title}</b><br><span class=mut>${x.by||""}</span></div>`).join("")}
 if(tab==5){h="<h1>Informations</h1>"+D.infos.map(x=>`<div class=card><b>${x.title}</b><br><span class=mut>${x.by||""}</span><br>${x.text||""}</div>`).join("")}
 if(tab==6){h="<h1>Cantine</h1>"+D.menus.map(m=>`<div class=card><b>${fmt(m.date,{weekday:"long",day:"numeric"})}</b><br>${m.meals.map(x=>x.join(", ")).filter(Boolean).join("<br>")}</div>`).join("")}
 if(tab==7){h=`<h1>Fond</h1><div class=sw>${Object.keys(T).map(k=>`<button style="background:${T[k][0]}" title="${k}" onclick="L.theme='${k}';theme()"></button>`).join("")}</div><h1>Couleur principale</h1><input type=color value="${L.ac||"#4f8cff"}" oninput="L.ac=this.value;theme()"><p><button class=go onclick="load(true)">Actualiser Pronote</button></p>`}
 $("app").innerHTML=h||"<p class=mut>Rien à afficher.</p>"}
theme();load();
</script></body></html>
